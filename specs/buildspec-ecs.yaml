version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "325866320827"       # replace with your account ID
    AWS_REGION: "ap-southeast-1"         # replace with your region
    ECR_REPO: "public/lab14-kien-cicd"      # replace with your ECR repo name
    CONTAINER_NAME: "lab14" # must match container name in task definition
    DOCKER_BUILDKIT: "1" # Enable BuildKit for better performance and multi-platform builds

phases:
  pre_build:
    commands:
      - echo Logging in to ECR...
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
      - IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:$IMAGE_TAG
      - docker buildx create --use --name mybuilder 
  build:
    commands:
      - echo Building Docker image...
      - cd app/
      - ls -la
      - echo Check docker buildx version and build image for multiple platforms...
      - docker buildx version
      - docker buildx build --platform linux/amd64,linux/arm64 -t $IMAGE_URI --push .  
  post_build:
    commands:
      - echo Build completed. Image URI
      - echo $IMAGE_URI
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME $IMAGE_URI > imagedefinitions.json
      - cat imagedefinitions.json
      - pwd
      - ls -la
      - echo Moving imagedefinitions.json to $CODEBUILD_SRC_DIR for CodePipeline...
      - mv imagedefinitions.json $CODEBUILD_SRC_DIR/imagedefinitions.json
      - echo moving appspec-ecs.yaml to $CODEBUILD_SRC_DIR for CodePipeline...
      - mv appspec-ecs.yaml $CODEBUILD_SRC_DIR/appspec-ecs.yaml
      - mv taskdef-ecs.json $CODEBUILD_SRC_DIR/taskdef-ecs.json
      - echo Listing files in $CODEBUILD_SRC_DIR... 
      - ls -la 
artifacts:
  files:
   - imagedefinitions.json
   - appspec-ecs.yaml
   - taskdef-ecs.json